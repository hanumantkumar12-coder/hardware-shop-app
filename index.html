<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a8917">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>HK Shop Hisaab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--green:#1a8917;--green-dark:#146b12;--green-light:#e8f5e9;--orange:#ff6d00;--orange-light:#fff3e0;--red:#e53935;--red-light:#ffebee;--blue:#1565c0;--blue-light:#e3f2fd;--gray:#f5f7fa;--text:#1a1a2e;--text2:#6b7280;--card:#fff;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:16px}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Devanagari',sans-serif;background:#f0f2f5;color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.05)}70%{transform:scale(.9)}100%{transform:scale(1);opacity:1}}
@keyframes ripple{0%{transform:scale(0);opacity:.5}100%{transform:scale(4);opacity:0}}

/* ===== AUTH ===== */
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a8917 0%,#2e7d32 50%,#1b5e20 100%);padding:24px;position:relative;overflow:hidden}
.auth-screen::before{content:'';position:absolute;top:-60%;right:-30%;width:500px;height:500px;background:radial-gradient(circle,rgba(255,255,255,.1) 0%,transparent 70%);border-radius:50%}
.auth-screen::after{content:'';position:absolute;bottom:-40%;left:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);border-radius:50%}
.auth-card{background:#fff;border-radius:24px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative;z-index:2;animation:bounceIn .6s ease}
.auth-logo{width:80px;height:80px;background:linear-gradient(135deg,var(--green),var(--green-dark));border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(26,137,23,.3);font-size:32px;color:#fff;font-weight:800}
.auth-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;color:var(--text)}
.auth-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.auth-field input{width:100%;padding:14px 16px;border:2px solid #e5e7eb;border-radius:14px;font-size:15px;background:#f9fafb;transition:all .2s;outline:none}
.auth-field input:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 4px rgba(26,137,23,.1)}
.auth-btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.auth-btn.primary{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;box-shadow:0 4px 16px rgba(26,137,23,.3)}
.auth-btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,137,23,.4)}
.auth-btn.primary:active{transform:translateY(0)}
.auth-btn.secondary{background:#f3f4f6;color:var(--text);margin-top:10px;border:1px solid #e5e7eb}
.auth-btn.google{background:#fff;color:var(--text);margin-top:14px;border:2px solid #e5e7eb;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
.auth-btn.google:hover{background:#f9fafb;border-color:#d1d5db}
.auth-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text2);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
.auth-note{text-align:center;font-size:12px;color:var(--text2);margin-top:16px}

/* ===== HEADER ===== */
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(26,137,23,.2)}
.header h1{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.header h1 .logo-sm{width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.header-actions{display:flex;gap:6px}
.header-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px)}
.header-btn:hover{background:rgba(255,255,255,.25)}
.header-btn:active{transform:scale(.95)}

/* ===== BOTTOM NAV ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e5e7eb;z-index:100;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.nav-item{flex:1;background:none;border:none;padding:10px 2px 8px;font-size:10px;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:all .2s;position:relative}
.nav-item .nav-icon{font-size:22px;transition:all .2s}
.nav-item.active{color:var(--green);font-weight:700}
.nav-item.active .nav-icon{transform:scale(1.15)}
.nav-item.active::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--green);border-radius:0 0 3px 3px}

/* ===== VIEWS ===== */
.view{display:none;padding:16px;padding-bottom:90px;max-width:720px;margin:0 auto;animation:fadeUp .3s ease}
.view.active{display:block}

/* ===== DASHBOARD CARDS ===== */
.dash-greeting{padding:4px 0 16px;font-size:14px;color:var(--text2)}
.dash-greeting b{color:var(--text);font-size:16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:fadeUp .4s ease;transition:transform .2s}
.stat-card:active{transform:scale(.97)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.stat-card.green::before{background:linear-gradient(90deg,var(--green),#4caf50)}
.stat-card.blue::before{background:linear-gradient(90deg,var(--blue),#42a5f5)}
.stat-card.orange::before{background:linear-gradient(90deg,var(--orange),#ffa726)}
.stat-card.red::before{background:linear-gradient(90deg,var(--red),#ef5350)}
.stat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.stat-card.green .stat-icon{background:var(--green-light);color:var(--green)}
.stat-card.blue .stat-icon{background:var(--blue-light);color:var(--blue)}
.stat-card.orange .stat-icon{background:var(--orange-light);color:var(--orange)}
.stat-card.red .stat-icon{background:var(--red-light);color:var(--red)}
.stat-label{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:800;animation:countUp .5s ease}
.stat-card.green .stat-value{color:var(--green)}
.stat-card.blue .stat-value{color:var(--blue)}
.stat-card.orange .stat-value{color:var(--orange)}
.stat-card.red .stat-value{color:var(--red)}

/* ===== SECTION HEADERS ===== */
.section-header{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.section-title{font-size:16px;font-weight:800;color:var(--text)}
.section-action{font-size:13px;font-weight:600;color:var(--green);cursor:pointer;text-decoration:none}

/* ===== LIST ITEMS ===== */
.list-item{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);transition:all .2s;animation:slideIn .3s ease;cursor:pointer}
.list-item:active{transform:scale(.98);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.list-item-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.avatar.green{background:linear-gradient(135deg,#43a047,#2e7d32)}
.avatar.blue{background:linear-gradient(135deg,#1e88e5,#1565c0)}
.avatar.orange{background:linear-gradient(135deg,#fb8c00,#ef6c00)}
.avatar.red{background:linear-gradient(135deg,#e53935,#c62828)}
.avatar.purple{background:linear-gradient(135deg,#8e24aa,#6a1b9a)}
.avatar.teal{background:linear-gradient(135deg,#00897b,#00695c)}
.list-item-info{flex:1;min-width:0}
.list-item-name{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item-sub{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item-right{text-align:right;flex-shrink:0;margin-left:8px}
.list-item-amount{font-size:16px;font-weight:800}
.list-item-amount.green{color:var(--green)}
.list-item-amount.red{color:var(--red)}
.list-item-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin-top:4px;display:inline-block}
.list-item-tag.credit{background:var(--red-light);color:var(--red)}
.list-item-tag.paid{background:var(--green-light);color:var(--green)}

/* ===== LOW STOCK CARD ===== */
.low-stock-item{background:linear-gradient(135deg,#fff3e0,#fff8e1);border:1px solid #ffcc02;border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;animation:slideIn .3s ease}
.low-stock-item .warn-icon{font-size:20px;margin-right:10px}

/* ===== SEARCH ===== */
.search-bar{width:100%;padding:14px 16px 14px 44px;border-radius:14px;border:2px solid #e5e7eb;background:#fff;font-size:15px;outline:none;transition:all .2s;margin-bottom:14px}
.search-bar:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(26,137,23,.1)}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;z-index:1}
.search-wrap .search-bar{padding-left:44px}

/* ===== FAB ===== */
.fab{position:fixed;right:20px;bottom:96px;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:28px;box-shadow:0 8px 24px rgba(26,137,23,.35);z-index:50;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.08);box-shadow:0 12px 32px rgba(26,137,23,.45)}
.fab:active{transform:scale(.95)}

/* ===== BUTTONS ===== */
.btn{padding:14px 20px;border:none;border-radius:14px;font-size:15px;font-weight:700;width:100%;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn.green{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;box-shadow:0 4px 16px rgba(26,137,23,.3)}
.btn.blue{background:linear-gradient(135deg,var(--blue),#1976d2);color:#fff;box-shadow:0 4px 16px rgba(21,101,192,.3)}
.btn.orange{background:linear-gradient(135deg,var(--orange),#e65100);color:#fff;box-shadow:0 4px 16px rgba(255,109,0,.3)}
.btn.gray{background:#f3f4f6;color:var(--text);border:1px solid #e5e7eb}
.btn.red{background:linear-gradient(135deg,var(--red),#c62828);color:#fff}
.btn.sm{padding:8px 14px;font-size:12px;width:auto;border-radius:10px}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1}

/* ===== MODAL ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;padding:16px;overflow:auto;backdrop-filter:blur(4px);animation:fadeUp .2s ease}
.modal-overlay.active{display:flex;align-items:flex-end;justify-content:center}
.modal-sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px 16px;width:100%;max-width:520px;max-height:85vh;overflow:auto;animation:fadeUp .3s ease;margin-top:auto}
.modal-handle{width:40px;height:4px;background:#d1d5db;border-radius:4px;margin:0 auto 16px}
.modal-sheet h3{font-size:18px;font-weight:800;margin-bottom:16px;color:var(--text)}

/* ===== FORM FIELDS ===== */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:2px solid #e5e7eb;border-radius:12px;font-size:15px;background:#f9fafb;outline:none;transition:all .2s}
.field input:focus,.field select:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 4px rgba(26,137,23,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===== CART / SALE ITEMS ===== */
.cart-item{background:#f9fafb;border-radius:14px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1fr 60px 80px 32px;gap:8px;align-items:center;border:1px solid #e5e7eb}
.cart-item input{padding:8px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;width:100%;text-align:center}
.cart-item .item-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total-row{display:flex;justify-content:space-between;font-size:15px;padding:8px 4px;font-weight:500}
.total-row.grand{font-size:18px;font-weight:800;color:var(--green);border-top:2px solid #e5e7eb;padding-top:12px;margin-top:8px}

/* ===== INVOICE / BILL ===== */
.invoice-header{text-align:center;padding:20px;border-bottom:3px dashed #e5e7eb;margin-bottom:16px}
.invoice-header h2{font-size:20px;font-weight:800;color:var(--green)}
.invoice-header p{font-size:12px;color:var(--text2);margin-top:4px}
.invoice-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:14px}
.invoice-row.total{border-top:2px solid var(--green);border-bottom:none;font-size:18px;font-weight:800;color:var(--green);padding-top:14px}

/* ===== MORE PAGE ===== */
.profile-card{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(26,137,23,.2)}
.profile-avatar{width:56px;height:56px;background:rgba(255,255,255,.2);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin-bottom:12px}
.profile-name{font-size:18px;font-weight:800}
.profile-email{font-size:13px;opacity:.8;margin-top:2px}
.profile-role{font-size:11px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:8px;display:inline-block;margin-top:8px;font-weight:600}
.menu-group{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.menu-item{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .15s}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:#f9fafb}
.menu-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.menu-icon.green{background:var(--green-light);color:var(--green)}
.menu-icon.blue{background:var(--blue-light);color:var(--blue)}
.menu-icon.orange{background:var(--orange-light);color:var(--orange)}
.menu-icon.red{background:var(--red-light);color:var(--red)}
.menu-text{flex:1;font-size:14px;font-weight:600}
.menu-arrow{color:#d1d5db;font-size:14px}
.menu-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:16px 16px 8px;background:transparent}

/* ===== TOAST ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 24px;border-radius:14px;font-size:14px;font-weight:600;display:none;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:bounceIn .3s ease}
.toast.show{display:block}

/* ===== AUDIT TABLE ===== */
.audit-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:13px}
.audit-table th{background:#f9fafb;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;text-align:left}
.audit-table td{padding:12px 14px;border-bottom:1px solid #f3f4f6}
.audit-tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.audit-tag.insert{background:#d1f2df;color:#12855c}
.audit-tag.update{background:#fff3cd;color:#856404}
.audit-tag.delete{background:#f8d7da;color:#a12633}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px}

/* ===== LOADING ===== */
.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:20px;margin-bottom:8px}
.skeleton-circle{width:44px;height:44px;border-radius:14px;animation:shimmer 1.5s infinite;background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%}

/* ===== SETUP BANNER ===== */
.setup-banner{background:linear-gradient(135deg,#fff3cd,#ffeaa7);border:1px solid #ffc107;border-radius:14px;padding:14px 16px;font-size:13px;color:#856404;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}

/* ===== PRINT AREA ===== */
#print-area{display:none}
@media print{body *{visibility:hidden}#print-area,#print-area *{visibility:visible;display:block}#print-area{position:absolute;top:0;left:0;width:100%;padding:16px;background:#fff}}

/* ===== RESPONSIVE ===== */
@media(min-width:520px){.stat-grid{grid-template-columns:repeat(4,1fr)}.modal-sheet{border-radius:24px;margin-bottom:20px}}
</style>
</head>
<body>

<div class="setup-banner" id="setupBanner" style="display:none">
  <span style="font-size:18px">⚠️</span>
  <div><b>Setup pending:</b> Open <b>config.js</b> and paste your Supabase URL + anon key.</div>
</div>

<!-- ==================== AUTH ==================== -->
<div class="auth-screen" id="v-auth">
  <div class="auth-card">
    <div class="auth-logo">HK</div>
    <div class="auth-title">HK Shop Hisaab</div>
    <div class="auth-sub">Stock • Sales • Udhaar • Audit</div>
    <div class="auth-field"><label>Email</label><input id="li-email" type="email" placeholder="owner@gmail.com"></div>
    <div class="auth-field"><label>Password</label><input id="li-pass" type="password" placeholder="••••••••"></div>
    <button class="auth-btn primary" onclick="doLogin()" data-i18n="login">Login</button>
    <button class="auth-btn secondary" onclick="doOtp()" data-i18n="otpBtn">📧 Email me a login link</button>
    <p id="otpMsg" style="font-size:12px;color:var(--text2);text-align:center;margin-top:6px"></p>
    <div class="auth-divider">OR</div>
    <button class="auth-btn google" onclick="doGoogle()"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_48dp.png" width="18">Continue with Google</button>
    <div class="auth-note">New member? Ask the owner to invite you.</div>
  </div>
</div>

<!-- ==================== APP HEADER ==================== -->
<header class="header" id="hdr" style="display:none">
  <h1><span class="logo-sm">HK</span> <span data-i18n="appTitle">Shop Hisaab</span></h1>
  <div class="header-actions">
    <button class="header-btn" onclick="toggleLang()" id="langBtn">हिंदी</button>
    <button class="header-btn" onclick="logout()" data-i18n="logout">Logout</button>
  </div>
</header>

<!-- ==================== VIEWS ==================== -->
<main id="app" style="display:none">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-stock"></section>
  <section class="view" id="v-sale"></section>
  <section class="view" id="v-khata"></section>
  <section class="view" id="v-more"></section>
</main>

<!-- ==================== BOTTOM NAV ==================== -->
<nav class="bottom-nav" id="navbar" style="display:none">
  <button class="nav-item active" data-v="home"><span class="nav-icon">🏠</span><span data-i18n="navHome">Home</span></button>

  <button class="nav-item" data-v="sale"><span class="nav-icon">🧾</span><span data-i18n="navSale">Sale</span></button>

</nav>

<script>
/* ================= CONFIG GUARD ================= */
const CONFIGURED = SUPABASE_URL && !SUPABASE_URL.includes('PASTE_');
const db = CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
if (!CONFIGURED) document.getElementById('setupBanner').style.display = 'flex';

/* ================= i18n ================= */

  price:"दाम ₹",subTotal:"सब-टोटल",discount:"छूट ₹",grandTotal:"कुल",paidAmt:"जमा ₹",
  mode:"भुगतान",cash:"नकद",upi:"UPI",credit:"उधार",saveSale:"✅ बिक्री सेव",

  khataOf:"खाता",recvPay:"भुगतान जमा",amount:"रकम ₹",note:"नोट",waShare:"व्हाट्सएप",print:"प्रिंट",
  purchases:"खरीद",newPurchase:"+ खरीद दर्ज",supplier:"सप्लायर",auditLog:"ऑडिट लॉग",
  settings:"सेटिंग",members:"सदस्य",exportCsv:"CSV निकालें",langName:"English",
  noData:"अभी कुछ नहीं है।",saved:"सेव हो गया ✓",confirmDel:"हटाएं?",low:"कम!",
  whoChanged:"किसने क्या बदला"}
};
let lang = localStorage.getItem('lang') || 'en';
const t = k => (L[lang][k] ?? L.en[k] ?? k);
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.getElementById('langBtn').textContent = lang==='en'?'हिंदी':'English';
  document.title = 'HK Shop Hisaab';}
function toggleLang(){lang = lang==='en'?'hi':'en';localStorage.setItem('lang',lang);applyI18n();render(current);}

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const toast=(m)=>{const el=$('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);};
function modal(html){$('modalContent').innerHTML=html;$('modalOverlay').classList.add('active');}
function closeModal(){$('modalOverlay').classList.remove('active');}
async function one(q){const{data,error}=await q;if(error){toast('⚠ '+error.message);throw error;}return data;}
let current='home', meProfile=null;

/* avatar colors */
const AV=['green','blue','orange','red','purple','teal'];
function avatarColor(name){let h=0;for(let i=0;i<(name||'').length;i++)h=name.charCodeAt(i)+((h<<5)-h);return AV[Math.abs(h)%AV.length];}
function avatarInitial(name){return (name||'?')[0].toUpperCase();}

/* ================= AUTH ================= */
async function doLogin(){
  if(!CONFIGURED)return toast('Edit config.js first!');
  const email=$('li-email').value.trim(),pass=$('li-pass').value;
  const{error}=await db.auth.signInWithPassword({email,password:pass});
  if(error)return toast('⚠ '+error.message);
  boot();
}
async function doGoogle(){
  if(!CONFIGURED)return toast('Setup pending!');
  const{error}=await db.auth.signInWithOAuth({provider:'google',
    options:{redirectTo:location.origin+location.pathname}});
  if(error)toast('⚠ '+error.message);
}
async function doOtp(){
  if(!CONFIGURED)return toast('Setup pending!');
  const em=$('li-email').value.trim();
  if(!em)return toast('Type your email first');
  const{error}=await db.auth.signInWithOtp({email:em,
    options:{emailRedirectTo:location.origin+location.pathname}});
  $('otpMsg').textContent=error?'⚠ '+error.message:(lang==='hi'?'✅ लिंक भेज दिया! ईमेल चेक करें।':'✅ Link sent! Check your email inbox.');
}
async function logout(){await db.auth.signOut();location.reload();}
async function boot(){
  if(!CONFIGURED)return;
  const{data:{user}}=await db.auth.getUser();
  if(!user)return;
  let prof=await one(db.from('profiles').select('*').eq('id',user.id).maybeSingle());
  if(!prof){prof={name:user.email,role:'staff'};}
  meProfile={...prof,email:user.email};
  $('v-auth').style.display='none';
  $('hdr').style.display='flex';$('app').style.display='block';$('navbar').style.display='flex';
  applyI18n();render('home');
}

/* ================= NAV ================= */
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');render(b.dataset.v);
});
function render(v){
  current=v;
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  const map={home:'v-home',stock:'v-stock',sale:'v-sale',khata:'v-khata',more:'v-more'};
  $(map[v]).classList.add('active');
  ({home:rHome,stock:rStock,sale:rSale,khata:rKhata,more:rMore})[v]();
}

/* ================= HOME ================= */
async function rHome(){
  const v=$('v-home');v.innerHTML='<div class="skeleton" style="height:80px"></div><div class="skeleton" style="height:80px"></div>';
  const today=new Date().toISOString().slice(0,10);
  const month=new Date().toISOString().slice(0,7);
  const[sales,prods]=await Promise.all([
    one(db.from('sales').select('total,due_amount,created_at')),
    one(db.from('products').select('name,current_stock,reorder_level').order('current_stock'))
  ]);
  const tSales=sales.filter(s=>s.created_at.slice(0,10)===today).reduce((a,b)=>a+ +b.total,0);
  const mSales=sales.filter(s=>s.created_at.slice(0,7)===month).reduce((a,b)=>a+ +b.total,0);
  const udhaar=sales.reduce((a,b)=>a+ +(b.due_amount||0),0);
  const low=prods.filter(p=>+(p.current_stock||0)<=+(p.reorder_level||0));
  const totalProducts=prods.length;
  const userName=meProfile?.name||meProfile?.email||'Owner';
  v.innerHTML=`
    <div class="dash-greeting">Hello, <b>${esc(userName)}</b> 👋</div>
    <div class="stat-grid">
      <div class="stat-card green"><div class="stat-icon">💰</div><div class="stat-label">${t('todaySale')}</div><div class="stat-value">${money(tSales)}</div></div>
      <div class="stat-card blue"><div class="stat-icon">📊</div><div class="stat-label">${t('monthSale')}</div><div class="stat-value">${money(mSales)}</div></div>
      <div class="stat-card orange"><div class="stat-icon">📒</div><div class="stat-label">${t('totalUdhaar')}</div><div class="stat-value">${money(udhaar)}</div></div>
      <div class="stat-card ${low.length?'red':'green'}"><div class="stat-icon">${low.length?'⚠️':'✅'}</div><div class="stat-label">${t('lowStock')}</div><div class="stat-value">${low.length}</div></div>
    </div>
    ${low.length?`<div class="section-header"><span class="section-title">⚠️ ${t('lowStock')}</span></div>`+low.slice(0,5).map(p=>
      `<div class="low-stock-item"><div style="display:flex;align-items:center;gap:10px"><span class="warn-icon">⚠️</span><div><div style="font-weight:700;font-size:14px">${esc(p.name)}</div><div style="font-size:12px;color:var(--text2)">Only ${p.current_stock} left</div></div></div><div style="font-weight:800;color:var(--red);font-size:15px">${p.current_stock}</div></div>`).join('')
    :''}`;
}

/* ================= STOCK ================= */
async function rStock(){
  const v=$('v-stock');
  v.innerHTML=`<div class="search-wrap"><input class="search-bar" placeholder="${t('searchPh')}" oninput="loadProducts(this.value)"></div>
   <button class="fab" title="${t('addProduct')}" onclick="editProduct()">＋</button><div id="plist"></div>`;
  loadProducts('');
}
window._prods=[];
async function loadProducts(q){
  let Q=db.from('products').select('*').order('name');
  if(q)Q=Q.ilike('name','%'+q+'%');
  window._prods=await one(Q.limit(300));
  $('plist').innerHTML=window._prods.length?window._prods.map((p,i)=>{
    const low=+(p.current_stock||0)<=+(p.reorder_level||0);
    return `<div class="list-item" onclick="editProduct(${i})">
      <div class="list-item-left">
        <div class="avatar ${avatarColor(p.name)}">${avatarInitial(p.name)}</div>
        <div class="list-item-info"><div class="list-item-name">${esc(p.name)}</div><div class="list-item-sub">${t('sell')} ${money(p.selling_price)} · ${t('cost')} ${meProfile.role==='owner'?money(p.purchase_price):'•••'}</div></div>
      </div>
      <div class="list-item-right"><div class="list-item-amount ${low?'red':'green'}">${p.current_stock}</div><div style="font-size:11px;color:var(--text2)">${esc(p.unit||'pcs')}</div></div></div>`;}).join('')
  :`<div class="empty-state"><div class="empty-icon">📦</div><p>${t('noData')}</p></div>`;
}
function editProduct(i){
  const p=i!=null?window._prods[i]:{};
  modal(`<h3>${i!=null?'Edit Product':t('addProduct')}</h3>
  <div class="field"><label>${t('product')}</label><input id="pf-name" value="${esc(p.name||'')}" placeholder="Product name"></div>
  <div class="grid2">
    <div class="field"><label>${t('unit')}</label><input id="pf-unit" value="${esc(p.unit||'pcs')}"></div>
    <div class="field"><label>${t('barcode')}</label><input id="pf-bc" value="${esc(p.barcode||'')}"></div>
    <div class="field"><label>${t('cost')}</label><input id="pf-cost" type="number" value="${p.purchase_price??''}"></div>
    <div class="field"><label>${t('sell')}</label><input id="pf-sell" type="number" value="${p.selling_price??''}"></div>
    <div class="field"><label>${t('stock')}</label><input id="pf-stk" type="number" value="${p.current_stock??0}"></div>
    <div class="field"><label>${t('minLvl')}</label><input id="pf-min" type="number" value="${p.reorder_level??0}"></div>
  </div>
  <button class="btn green" onclick="saveProduct(${p.id??null})">${t('save')}</button>
  <button class="btn gray" style="margin-top:10px" onclick="closeModal()">${t('cancel')}</button>
  ${p.id?`<button class="btn red" style="margin-top:10px" onclick="delProduct(${p.id})">🗑 ${t('del')}</button>`:''}`);
}
async function saveProduct(id){
  const rec={name:$('pf-name').value.trim(),unit:$('pf-unit').value.trim(),barcode:$('pf-bc').value.trim()||null,
    purchase_price:+($('pf-cost').value||0),selling_price:+($('pf-sell').value||0),
    current_stock:+($('pf-stk').value||0),reorder_level:+($('pf-min').value||0)};
  if(!rec.name)return toast('Name?');
  const q=id?db.from('products').update(rec).eq('id',id):db.from('products').insert(rec);
  await one(q);closeModal();toast(t('saved'));loadProducts($('#q')?.value||'');render('stock');
}
async function delProduct(id){if(!confirm(t('confirmDel')))return;await one(db.from('products').delete().eq('id',id));closeModal();render('stock');}

/* ================= SALE ================= */
let cart=[],saleCust=null;
async function rSale(){
  const v=$('v-sale');cart=cart.length?cart:[];saleCust=null;
  v.innerHTML=`<h3 style="margin-bottom:14px;font-size:18px">${t('newSale')}</h3>
  <div class="field"><label>${t('customer')}</label><select id="sl-cust" onchange="saleCust=this.value||null"></select></div>
  <div id="cart"></div>
  <button class="btn ghost" style="margin-bottom:12px" onclick="pickItem()">＋ ${t('addItem')}</button>
  <div class="total-row"><span>${t('subTotal')}</span><span id="t-sub">₹0</span></div>
  <div class="menu-label">Payment Split</div>
  <div class="grid2">
    <div class="field"><label>💵 Cash ₹</label><input id="sl-cash" type="number" value="0" oninput="calcDue()"></div>
    <div class="field"><label>📱 UPI ₹</label><input id="sl-upi" type="number" value="0" oninput="calcDue()"></div>
  </div>
  <div class="total-row"><span>Credit (Udhaar)</span><span id="t-credit" style="color:var(--red)">₹0</span></div>
  <button class="btn green" onclick="saveSale()">${t('saveSale')}</button>
  <div class="section-header"><span class="section-title">${t('salesHistory')}</span></div><div id="saleslist"></div>`;
  const custs=await one(db.from('customers').select('id,name').order('name'));
  $('sl-cust').innerHTML=`<option value="">🚶 ${t('walkIn')}</option>`+custs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  drawCart();loadSales();
}
async function pickItem(){
  const prods=await one(db.from('products').select('id,name,selling_price,current_stock,unit').order('name'));
  modal(`<h3>${t('addItem')}</h3><div class="search-wrap"><input class="search-bar" placeholder="${t('searchPh')}" oninput="flist(this.value)"></div>
   <div id="picklist" style="max-height:50vh;overflow:auto">${prods.map(ppick).join('')}</div>
   <button class="btn gray" style="margin-top:10px" onclick="closeModal()">${t('cancel')}</button>`);
  window._allp=prods;
}
function ppick(p){return `<div class="list-item" onclick='addCart(${JSON.stringify({id:p.id,name:p.name,price:p.selling_price})})'>
 <div class="list-item-left"><div class="avatar ${avatarColor(p.name)}">${avatarInitial(p.name)}</div>
 <div class="list-item-info"><div class="list-item-name">${esc(p.name)}</div><div class="list-item-sub">${p.current_stock} ${esc(p.unit||'pcs')} available</div></div></div>
 <div class="list-item-right"><div class="list-item-amount">${money(p.selling_price)}</div></div></div>`;}
function flist(q){$('picklist').innerHTML=window._allp.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())).map(ppick).join('');}
function addCart(p){const ex=cart.find(c=>c.id===p.id);ex?ex.qty++:cart.push({...p,qty:1});drawCart();closeModal();}
function rmCart(i){cart.splice(i,1);drawCart();}
function drawCart(){
  $('cart').innerHTML=cart.length?cart.map((c,i)=>`<div class="cart-item">
    <div class="item-name">${esc(c.name)}</div>
    <input type="number" min="0.01" step="any" value="${c.qty}" oninput="cart[${i}].qty=+this.value;calcTot()">
    <input type="number" step="any" value="${c.price}" oninput="cart[${i}].price=+this.value;calcTot()">
    <button class="btn red sm" onclick="rmCart(${i})" style="width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center">×</button></div>`).join('')
  :'<div class="empty-state" style="padding:20px"><div class="empty-icon">🛒</div><p>No items in cart</p></div>';
  calcTot();
}
function calcTot(){const s=cart.reduce((a,c)=>a+c.qty*c.price,0);$('t-sub').textContent=money(s);calcDue();return s;}
function calcDue(){
  const total=cart.reduce((a,c)=>a+c.qty*c.price,0);
  const cash=+($('sl-cash')?.value||0);
  const upi=+($('sl-upi')?.value||0);
  const credit=Math.max(total-cash-upi,0);
  if($('t-credit'))$('t-credit').textContent=money(credit);
}
async function saveSale(){
  if(!cart.length)return toast('Empty!');
  const total=calcTot(),cash=+($('sl-cash')?.value||0),upi=+($('sl-upi')?.value||0);
  const paid=cash+upi;
  const mode=cash>0&&upi>0?'mixed':cash>0?'cash':upi>0?'upi':'credit';
  const items=cart.map(c=>({product_id:c.id,qty:c.qty,unit_price:c.price}));
  const sid=await one(db.rpc('create_sale',{p_customer_id:saleCust?+saleCust:null,p_items:JSON.stringify(items),p_paid:paid,p_mode:mode}));
  closeModal&&0;toast(t('saved')+' #'+sid);
  const custName=saleCust?$('sl-cust').selectedOptions[0].textContent:t('walkIn');
  const billLines=cart.map(c=>`${c.name} ×${c.qty} = ₹${(c.qty*c.price).toFixed(0)}`).join('\n');
  const paySplit=cash>0&&upi>0?`Cash: ₹${cash} + UPI: ₹${upi}`:cash>0?`Cash: ₹${cash}`:upi>0?`UPI: ₹${upi}`:'Credit';
  const bill=`🧾 *Bill #${sid}*\n${custName}\n${billLines}\n*TOTAL: ₹${total.toFixed(0)}*\nPaid: ${paySplit}${paid<total?`\nCredit: ₹${(total-paid).toFixed(0)}`:''}\n— HK Shop Hisaab`;
  $('print-area').innerHTML=`<div class="invoice-header"><h2>HK Shop Hisaab</h2><p>Bill #${sid} · ${esc(custName)} · ${new Date().toLocaleString('en-IN')}</p></div>
    ${cart.map(c=>`<div class="invoice-row"><span>${esc(c.name)} × ${c.qty}</span><span>₹${(c.qty*c.price).toFixed(2)}</span></div>`).join('')}
    <div class="invoice-row total"><span>TOTAL</span><span>₹${total.toFixed(2)}</span></div>
    <div class="invoice-row"><span>Paid (${paySplit})</span><span>₹${paid.toFixed(2)}</span></div>
    ${paid<total?`<div class="invoice-row" style="color:var(--red)"><span>Credit (Udhaar)</span><span>₹${(total-paid).toFixed(2)}</span></div>`:''}`;
  cart=[];render('sale');
  modal(`<h3>#${sid} ✅</h3>
  <div style="margin:12px 0;padding:12px;background:#f9fafb;border-radius:12px">
    <div class="total-row"><span>Total</span><span>${money(total)}</span></div>
    <div class="total-row"><span>Paid</span><span style="color:var(--green)">${money(paid)}</span></div>
    ${paid<total?`<div class="total-row"><span>Credit</span><span style="color:var(--red)">${money(total-paid)}</span></div>`:''}
  </div>
  <div class="btn-row"><button class="btn green" onclick="window.open('https://wa.me/?text=${encodeURIComponent(bill)}','_blank')">📲 ${t('waShare')}</button>
  <button class="btn blue" onclick="window.print()">🖨 ${t('print')}</button></div>
  <button class="btn gray" style="margin-top:10px" onclick="closeModal()">OK</button>`);
}
async function loadSales(){
  const s=await one(db.from('sales').select('*,customers(name)').order('created_at',{ascending:false}).limit(30));
  $('saleslist').innerHTML=s.length?s.map(x=>`<div class="list-item">
    <div class="list-item-left">
      <div class="avatar ${avatarColor(x.customers?.name||'W')}">${avatarInitial(x.customers?.name||'W')}</div>
      <div class="list-item-info"><div class="list-item-name">#${x.invoice_no||x.id} · ${esc(x.customers?.name||t('walkIn'))}</div>

async function saveCust(id){

async function openKhata(i){
  const c=window._custs[i];
  const[sales,pays]=await Promise.all([
    one(db.from('sales').select('*').eq('customer_id',c.id).order('created_at',{ascending:false}).limit(50)),

function drawPu(prods){

async function savePur(){

/* -------- Day Book -------- */
async function showDayBook(){
  const today=new Date().toISOString().slice(0,10);
  const tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);
  const[sales,pays]=await Promise.all([
    one(db.from('sales').select('*,customers(name)').gte('created_at',today).lt('created_at',tomorrow).order('created_at')),
    one(db.from('payments').select('*,customers(name)').gte('created_at',today).lt('created_at',tomorrow).order('created_at'))
  ]);
  const cashIn=pays.filter(p=>p.mode==='cash').reduce((a,b)=>a+ +b.amount,0);
  const upiIn=pays.filter(p=>p.mode==='upi').reduce((a,b)=>a+ +b.amount,0);
  const creditSales=sales.filter(s=>+s.due_amount>0).reduce((a,b)=>a+ +b.due_amount,0);
  const totalSales=sales.reduce((a,b)=>a+ +b.total,0);
  modal(`<h3>📅 Day Book — ${today}</h3>
  <div class="stat-grid" style="margin:12px 0">
    <div class="stat-card green" style="padding:12px"><div class="stat-label">Total Sales</div><div class="stat-value" style="font-size:18px">${money(totalSales)}</div></div>
    <div class="stat-card blue" style="padding:12px"><div class="stat-label">Cash In</div><div class="stat-value" style="font-size:18px">${money(cashIn)}</div></div>
    <div class="stat-card orange" style="padding:12px"><div class="stat-label">UPI In</div><div class="stat-value" style="font-size:18px">${money(upiIn)}</div></div>
    <div class="stat-card red" style="padding:12px"><div class="stat-label">Credit Given</div><div class="stat-value" style="font-size:18px">${money(creditSales)}</div></div>
  </div>
  <div class="menu-label">Sales (${sales.length})</div>
  <div style="max-height:30vh;overflow:auto">${sales.length?sales.map(s=>`<div class="list-item" style="margin-bottom:6px">
    <div class="list-item-left"><div class="avatar ${avatarColor(s.customers?.name||'W')}" style="width:36px;height:36px;font-size:13px;border-radius:10px">${avatarInitial(s.customers?.name||'W')}</div>
    <div class="list-item-info"><div class="list-item-name" style="font-size:13px">#${s.invoice_no||s.id} · ${esc(s.customers?.name||'Walk-in')}</div><div class="list-item-sub">${new Date(s.created_at).toLocaleTimeString('en-IN')} · ${s.payment_mode.toUpperCase()}</div></div></div>
    <div class="list-item-right"><div class="list-item-amount" style="font-size:14px">${money(s.total)}</div></div></div>`).join(''):'<div class="empty-state" style="padding:16px"><p>No sales today</p></div>'}</div>
  <div class="menu-label">Payments (${pays.length})</div>
  <div style="max-height:25vh;overflow:auto">${pays.length?pays.map(p=>`<div class="list-item" style="margin-bottom:6px">
    <div class="list-item-left"><div class="avatar green" style="width:36px;height:36px;font-size:13px;border-radius:10px">💰</div>
    <div class="list-item-info"><div class="list-item-name" style="font-size:13px">${esc(p.customers?.name||'?')} · ${p.mode==='mixed'?'Cash+UPI':p.mode.toUpperCase()}</div><div class="list-item-sub">${new Date(p.created_at).toLocaleTimeString('en-IN')}</div></div></div>
    <div class="list-item-right"><div class="list-item-amount green" style="font-size:14px">+${money(p.amount)}</div></div></div>`).join(''):'<div class="empty-state" style="padding:16px"><p>No payments today</p></div>'}</div>
  <button class="btn gray" style="margin-top:12px" onclick="closeModal()">${t('cancel')}</button>`);
}

/* -------- audit -------- */
async function showAudit(){
  const rows=await one(db.from('audit_log').select('*').order('id',{ascending:false}).limit(100));
  modal(`<h3>🕵 Audit Log (${rows.length})</h3>
  <div style="max-height:60vh;overflow:auto"><table class="audit-table"><tr><th>Who</th><th>What</th><th>When</th></tr>
  ${rows.map(r=>`<tr onclick="auditDetail(this)" data-old='${esc(JSON.stringify(r.old_row))}' data-new='${esc(JSON.stringify(r.new_row))}' style="cursor:pointer">
   <td style="font-weight:600">${esc(r.actor_name||'?')}</td>
   <td><span class="audit-tag ${(r.action||'I')[0]}">${r.action}</span> ${esc(r.table_name)} #${r.row_id??''}</td>
   <td style="color:var(--text2)">${new Date(r.acted_at).toLocaleString('en-IN')}</td></tr>`).join('')}</table></div>
  <p style="font-size:12px;color:var(--text2);margin-top:8px">Tap a row to see old → new values.</p>
  <button class="btn gray" style="margin-top:10px" onclick="closeModal()">${t('cancel')}</button>`);
}
function auditDetail(tr){
  const o=JSON.parse(tr.dataset.old||'{}'),n=JSON.parse(tr.dataset.new||'{}');
  const keys=[...new Set([...Object.keys(o||{}),...Object.keys(n||{})])].filter(k=>!['updated_at'].includes(k));
  const diffs=keys.filter(k=>JSON.stringify(o?.[k])!==JSON.stringify(n?.[k]))
    .map(k=>`<tr><td style="font-weight:600">${k}</td><td>${esc(JSON.stringify(o?.[k]))}</td><td>${esc(JSON.stringify(n?.[k]))}</td></tr>`).join('');
  alert(`${t('whoChanged')}:\n\n`+(diffs?diffs.replace(/<\/?td>|<\/?tr>/g,' | '):'(insert/delete)'));
}
/* -------- csv -------- */
async function exportCsv(tbl){
  let all=[],from=0;
  while(true){
    const page=await one(db.from(tbl).select('*').range(from,from+999));
    all=all.concat(page);if(page.length<1000)break;from+=1000;
    if(from>=5000)break;
  }
  if(!all.length)return toast(t('noData'));
  const cols=Object.keys(all[0]);
  const csv=[cols.join(',')].concat(all.map(r=>cols.map(c=>'"'+String(r[c]??'').replaceAll('"','""')+'"').join(','))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=tbl+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
