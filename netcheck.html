(function(){
  var t=function(){return Date.now();};
  log('start');
  fetch('https://firestore.googleapis.com/v1/projects/hkshophisaab/databases/default/documents/shops/avfdpkytaxeqiuzmpxdu/products?pageSize=1',{cache:'no-store'})
    .then(function(r){log('fetch firestore REST: HTTP '+r.status);},function(e){log('fetch firestore REST FAIL: '+e);})

    })
    .then(function(){
      try{
        firebase.initializeApp({apiKey:'AIzaSyBfN_J3VCJc63ZFzxxxmmt1un64wjEM7JY',authDomain:'hkshophisaab.firebaseapp.com',projectId:'hkshophisaab'});
        var db=firebase.firestore();
        var t0=t();
        log('sdk get starting...');
        return db.collection('shops').doc('avfdpkytaxeqiuzmpxdu').collection('products').get()
          .then(function(snap){log('sdk get OK size='+snap.size+' in '+(t()-t0)+'ms');},
